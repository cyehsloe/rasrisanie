<html lang="ru">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#eef2fb;--card:#fff;--ink:#1d2433;--mut:#667085;--ac:#5b7cf0;--acs:#e3eaff;--line:#e1e6f2;--ex:#fdebc8;--exi:#8a5800;--ok:#3f9d73;--bad:#d1495b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--ink:#eceef3;--mut:#9aa1ae;--ac:#8fa8ff;--acs:#29324f;--line:#2c313c;--ex:#4a3a18;--exi:#f3c877;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--ink:#eceef3;--mut:#9aa1ae;--ac:#8fa8ff;--acs:#29324f;--line:#2c313c;--ex:#4a3a18;--exi:#f3c877;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.inp{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;outline:none}
.inp:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;border:0}
:root[data-theme="dark"] .btn{color:#10142a}
.ghost{background:var(--acs);color:var(--ac);border-radius:12px;padding:8px 12px;font-weight:700;border:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--mut);background:var(--card)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
:root[data-theme="dark"] .chip.on{color:#10142a}
.tag{background:var(--ex);color:var(--exi);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:800}
.mut{color:var(--mut)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const P={
cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
task:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
users:'<circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9"/>',
trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1 1.2-1.2.6-2 2-2 3.800M14 14.700V17c0 .6.5 1 1 1.200 1.200.6 2 2 2 3.800M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',

plus:'<path d="M5 12h14M12 5v14"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
l:'<path d="m15 18-6-6 6-6"/>',
r:'<path d="m9 18 6-6-6-6"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
link:'<path d="M10 13a5 5 0 0 0 7.500.500l3-3a5 5 0 0 0-7.100-7.100l-1.700 1.700M14 11a5 5 0 0 0-7.500-.500l-3 3a5 5 0 0 0 7.100 7.100l1.700-1.700"/>',
check:'<path d="M20 6 9 17l-5-5"/>',

const useLS=(k,d)=>{const[v,setV]=useState(()=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}});
useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},[v]);return[v,setV]};
const uid=()=>Math.random().toString(36).slice(2,9);
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const m=t=>{const[a,b]=(t||'0:0').split(':').map(Number);return a*60+b};
const DEF={bells:[['08:30','09:10'],['09:20','10:00'],['10:15','10:55'],['11:05','11:45'],['12:10','12:50'],['13:15','13:55'],['14:05','14:40']],
bellsMon:[['08:20','08:50'],['09:00','09:40'],['09:50','10:30'],['10:45','11:25'],['11:35','12:15'],['12:40','13:20'],['13:45','14:25']],
subjects:['Разговоры о важном','Алгебра','Геометрия','Вероятность и статистика','Русский язык','Литература','Английский язык','История','Обществознание','Биология','Химия','Физика','Физический практикум','Информатика','Основы программирования','Индивидуальный проект','ОБЗР','Физкультура','Россия — мои горизонты','Моя семья']};
const TE={ш:'Шишкарева К.В.',б:'Бондарчук Т.П.',в:'Смирнова В.А.',е:'Смирнова Е.В.',к:'Круль С.А.',с:'Соколова У.В.',м:'Мясникова А.Р.',я:'Семянников А.А.',т:'Степаненко Е.А.',н:'Коваль Н.И.'};
const R=[[0,1,'Разговоры о важном','4','ш'],[0,2,'Биология','33','б'],[0,3,'Химия','33','б'],[0,4,'Информатика','инф 2','в'],[0,5,'Информатика','инф 2','в'],[0,6,'Физкультура','спортзал','м'],[0,7,'Физкультура','спортзал','м'],
[1,1,'Литература','4','ш'],[1,2,'Русский язык','4','ш'],[1,3,'Русский язык','4','ш'],[1,4,'Английский язык','18','н'],[1,5,'Алгебра','26','к'],[1,6,'Алгебра','26','к'],
[2,1,'Алгебра','26','к'],[2,2,'Алгебра','26','к'],[2,3,'Физика','31','е'],[2,4,'Физика','31','е'],[2,5,'Литература','4','ш'],[2,6,'Литература','4','ш'],
[3,1,'Вероятность и статистика','26','к'],[3,2,'Обществознание','20','с'],[3,3,'Обществознание','20','с'],[3,4,'ОБЗР','14','я'],[3,5,'Геометрия','26','к'],[3,6,'Геометрия','26','к'],[3,7,'Россия — мои горизонты','4','ш'],
[4,1,'История','20','т'],[4,2,'История','20','т'],[4,3,'Физика','31','е'],[4,4,'Физика','31','е'],[4,5,'Физический практикум','31','е'],[4,6,'Геометрия','26','к'],[4,7,'Моя семья','','ш'],
[5,1,'Основы программирования','инф 2','в'],[5,2,'Основы программирования','инф 2','в'],[5,3,'Английский язык','18','н'],[5,4,'Английский язык','18','н'],[5,5,'Физика','31','е'],[5,6,'Индивидуальный проект','инф 2','в'],[5,6,'Индивидуальный проект','31','е']];
const DL=R.map(([day,n,subject,room,t],i)=>({id:'d'+i,day,n,subject,room,teacher:TE[t]}));
const rm=r=>/^\d+$/.test(r)?'каб. '+r:r;
const STAGES=['Школьный','Муниципальный','Региональный','Заключительный'];
const STATUS=['Готовлюсь','Написал, жду результатов','Прошёл','Не прошёл'];

function Sheet({title,onClose,children}){
return <div className="fixed inset-0 z-50 flex items-end" style={{background:'rgba(10,14,25,.45)'}} onClick={onClose}>
<div className="w-full card max-h-[88%] overflow-y-auto p-4" style={{borderRadius:'22px 22px 0 0',paddingBottom:'calc(1rem + env(safe-area-inset-bottom,0px))'}} onClick={e=>e.stopPropagation()}>
<div className="flex items-center justify-between mb-3"><div className="text-lg font-extrabold">{title}</div>
<button aria-label="Закрыть" className="ghost" onClick={onClose}><I n="x" s={18}/></button></div>{children}</div></div>}
const Lbl=({t,children})=><label className="block mb-3"><div className="text-sm font-bold mut mb-1">{t}</div>{children}</label>;
const Empty=({t})=><div className="text-center mut py-10 px-6">{t}</div>;

function Schedule({D,go}){
const{lessons,setLessons,extras,settings,notes}=D;
const now=new Date();const todayIdx=(now.getDay()+6)%7;
const[day,setDay]=useState(todayIdx>5?0:todayIdx);
const[tick,setTick]=useState(0);const[add,setAdd]=useState(false);const[note,setNote]=useState(null);
useEffect(()=>{const i=setInterval(()=>setTick(t=>t+1),20000);return()=>clearInterval(i)},[]);
const build=d=>{
const a=lessons.filter(l=>l.day===d).map(l=>{const b=(l.day===0?settings.bellsMon:settings.bells)[l.n-1]||['',''];return{...l,s:b[0],e:b[1],extra:false}});
const b=extras.filter(x=>x.days.includes(d)).map(x=>({id:x.id,n:'',subject:x.title,room:x.place,s:x.s,e:x.e,extra:true}));
return[...a,...b].sort((p,q)=>m(p.s)-m(q.s))};
const items=useMemo(()=>build(day),[day,lessons,extras,settings]);
const n=new Date();const cur=n.getHours()*60+n.getMinutes();
let status=null;
if(todayIdx<=5){const t=build(todayIdx);
const c=t.find(i=>m(i.s)<=cur&&cur<m(i.e));
if(c)status={now:true,i:c,min:m(c.e)-cur};
else{const nx=t.find(i=>m(i.s)>cur);status=nx?{now:false,i:nx,min:m(nx.s)-cur}:{done:true}}}
const sx=useRef(null);
const swipe=e=>{if(sx.current==null)return;const dx=e.changedTouches[0].clientX-sx.current;sx.current=null;
if(Math.abs(dx)>60)setDay(d=>Math.max(0,Math.min(5,d+(dx<0?1:-1))))};
return <div onTouchStart={e=>sx.current=e.touches[0].clientX} onTouchEnd={swipe} className="min-h-full">
<div className="px-4 pt-1">
<div className="card p-3 mb-3" style={{background:'var(--acs)',borderColor:'transparent'}}>
{status&&status.i?<div className="flex items-center gap-3"><I n="clock" c="shrink-0" s={26}/>
<div className="min-w-0"><div className="text-sm mut font-bold">{status.now?'Сейчас идёт':'Дальше'}</div>
<div className="font-extrabold truncate">{status.i.subject}{status.i.room?' · '+rm(status.i.room):''}</div>
<div className="text-sm">{status.now?`Осталось ${status.min} мин`:`Начнётся через ${status.min>=60?Math.floor(status.min/60)+' ч '+status.min%60+' мин':status.min+' мин'}`}</div></div></div>
:<div className="flex items-center gap-3"><I n="check" s={24}/><div className="font-bold">{todayIdx>5?'Сегодня воскресенье — отдыхай':'На сегодня занятия закончились'}</div></div>}
</div>
<Soon D={D}/><Pack D={D} todayIdx={todayIdx}/><div className="flex gap-1.5 mb-3">{DAYS.map((d,i)=><button key={d} onClick={()=>setDay(i)} className={'chip flex-1 !px-0 '+(i===day?'on':'')} style={i===todayIdx&&i!==day?{borderColor:'var(--ac)'}:{}}>{d}</button>)}</div>
<div className="flex items-center justify-between mb-2">
<button aria-label="Предыдущий день" className="ghost" disabled={day===0} onClick={()=>setDay(day-1)} style={{opacity:day===0?.4:1}}><I n="l" s={18}/></button>
<div className="font-extrabold text-lg">{DAYF[day]}</div>
<button aria-label="Следующий день" className="ghost" disabled={day===5} onClick={()=>setDay(day+1)} style={{opacity:day===5?.4:1}}><I n="r" s={18}/></button></div>
</div>
<div className="px-4 space-y-2 pb-3">
{items.length===0&&<Empty t="В этот день уроков нет. Добавь первый урок кнопкой ниже."/>}
{items.map(i=>{const act=day===todayIdx&&m(i.s)<=cur&&cur<m(i.e);
return <div key={(i.extra?'e':'l')+i.id} onClick={()=>setNote(i)} className="card p-3 flex items-center gap-3" style={{cursor:'pointer',borderLeft:'6px solid '+(i.extra?'#e0a030':col(i.subject,settings.colors)),boxShadow:act?'0 0 0 2px var(--ac)':'none'}}>
<div className="w-14 shrink-0 text-center"><div className="font-extrabold">{i.s}</div><div className="text-xs mut">{i.e}</div></div>
<div className="w-px self-stretch" style={{background:'var(--line)'}}/>
<div className="flex-1 min-w-0"><div className="font-bold truncate">{i.subject} {i.extra&&<span className="tag ml-1">Доп.</span>}</div>
<div className="text-sm mut">{i.extra?'':i.n+' урок'}{!i.extra&&i.room?' · ':''}{i.room?rm(i.room):''}</div>{i.teacher&&<div className="text-sm mut">{i.teacher}</div>}{notes[i.id]&&<div className="text-sm truncate" style={{color:'var(--ac)'}}>✎ {notes[i.id]}</div>}</div>
{!i.extra&&<button aria-label="Удалить урок" className="mut p-2" onClick={e=>{e.stopPropagation();setLessons(lessons.filter(l=>l.id!==i.id))}}><I n="trash" s={18}/></button>}
</div>})}
<button className="btn w-full flex items-center justify-center gap-2" onClick={()=>setAdd(true)}><I n="plus" s={18}/>Добавить урок</button>
</div>
{add&&<LessonForm D={D} day={day} onClose={()=>setAdd(false)}/>}
{note&&<NoteSheet D={D} item={note} onClose={()=>setNote(null)}/>}
</div>}

function Pack({D,todayIdx}){
const{lessons,hw,exams,pack,setPack}=D;const[open,setOpen]=useState(true);
const nd=todayIdx>=5?0:todayIdx+1;
const dt=new Date();dt.setDate(dt.getDate()+(todayIdx===5?2:1));
const key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const subs=[...new Set(lessons.filter(l=>l.day===nd).sort((a,b)=>a.n-b.n).map(l=>l.subject))];
const done=pack[key]||[];
const tog=s=>setPack({[key]:done.includes(s)?done.filter(x=>x!==s):[...done,s]});
const ex=exams.filter(e=>e.date===key);
if(!subs.length)return null;
return <div className="card mb-3">
<button className="w-full flex items-center justify-between p-3 font-extrabold" onClick={()=>setOpen(!open)}><span>Что взять {todayIdx>=5?'в понедельник':'завтра'}</span><span className="mut text-sm font-bold">{done.length}/{subs.length}</span></button>
{open&&<div className="px-3 pb-3 space-y-1.5">
{ex.map(e=><div key={e.id} className="text-sm font-bold" style={{color:'var(--bad)'}}>{e.type}: {e.subject}{e.topic?' — '+e.topic:''}</div>)}
{subs.map(s=>{const on=done.includes(s);const n=hw.filter(h=>!h.done&&h.subject===s).length;
return <button key={s} onClick={()=>tog(s)} className="w-full flex items-center gap-3 text-left py-1">
<span className="w-6 h-6 rounded-lg flex items-center justify-center shrink-0" style={{border:'2px solid '+(on?'var(--ok)':'var(--line)'),background:on?'var(--ok)':'transparent',color:'#fff'}}>{on&&<I n="check" s={14}/>}</span>
<span className="flex-1" style={{textDecoration:on?'line-through':'none',opacity:on?.55:1}}>{s}{/Физкульт/.test(s)&&' + форма'}</span>{n>0&&<span className="tag">ДЗ: {n}</span>}</button>})}
</div>}</div>}

function Exams({D}){
const{exams,setExams,settings}=D;
const[f,setF]=useState({subject:settings.subjects[0]||'',type:'Контрольная',date:'',topic:''});
const t0=new Date();t0.setHours(0,0,0,0);
const left=d=>Math.round((new Date(d+'T00:00:00')-t0)/864e5);
const lab=n=>n<0?'прошла':n===0?'сегодня':n===1?'завтра':'через '+n+' дн.';
const add=()=>{if(!f.date)return;setExams([...exams,{...f,id:uid()}]);setF({...f,topic:'',date:''})};
const sorted=[...exams].sort((a,b)=>((left(a.date)<0)-(left(b.date)<0))||(a.date>b.date?1:-1));
return <>
<div className="card p-3 mb-3 space-y-2">
<div className="flex gap-2"><select className="inp" value={f.subject} onChange={e=>setF({...f,subject:e.target.value})}>{settings.subjects.map(s=><option key={s}>{s}</option>)}</select>
<select className="inp" value={f.type} onChange={e=>setF({...f,type:e.target.value})}>{['Контрольная','Экзамен','Зачёт','Самостоятельная'].map(s=><option key={s}>{s}</option>)}</select></div>
<div className="flex gap-2"><input type="date" className="inp" value={f.date} onChange={e=>setF({...f,date:e.target.value})} aria-label="Дата"/>
<input className="inp" value={f.topic} onChange={e=>setF({...f,topic:e.target.value})} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Тема (необязательно)"/>
<button className="btn" aria-label="Добавить" onClick={add}><I n="plus" s={20}/></button></div></div>
<div className="space-y-2">{sorted.length===0&&<Empty t="Контрольных пока нет. Выбери предмет и дату выше."/>}
{sorted.map(e=>{const n=left(e.date);return <div key={e.id} className="card p-3 flex items-center gap-3" style={{opacity:n<0?.55:1}}>
<div className="w-20 shrink-0 text-center font-extrabold" style={{color:n>=0&&n<=2?'var(--bad)':'var(--ac)'}}>{lab(n)}</div>
<div className="flex-1 min-w-0"><div className="font-bold">{e.type}: {e.subject}</div><div className="text-sm mut">{e.date.split('-').reverse().slice(0,2).join('.')}{e.topic?' · '+e.topic:''}</div></div>
<button aria-label="Удалить" className="mut p-2" onClick={()=>setExams(exams.filter(x=>x.id!==e.id))}><I n="trash" s={18}/></button></div>})}</div>
</>}

const PAL=['#5b7cf0','#e0698a','#3f9d73','#e0a030','#8a63d2','#2fa8c4','#d9714a','#7a8a99'];
const col=(s,c)=>(c&&c[s])||PAL[[...(s||'')].reduce((a,ch)=>a+ch.charCodeAt(0),0)%PAL.length];
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const beep=()=>{try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},450)}catch(e){}};

function Pomo({pm,setPm,subjects}){
const total=(pm.mode==='work'?pm.w:pm.b)*60;
const left=pm.run?Math.max(0,Math.ceil((pm.end-Date.now())/1000)):pm.rem;
const frac=total?1-left/total:0;const R=100,C=2*Math.PI*R;
const set=patch=>setPm(p=>({...p,run:false,...patch}));
const mode=md=>set({mode:md,rem:(md==='work'?pm.w:pm.b)*60});
const cfg=(k,d)=>{const v=Math.max(1,Math.min(90,pm[k]+d));set({[k]:v,...(pm.mode===(k==='w'?'work':'break')?{rem:v*60}:{})})};
const toggle=()=>pm.run?setPm(p=>({...p,run:false,rem:Math.max(1,Math.ceil((p.end-Date.now())/1000))})):setPm(p=>({...p,run:true,end:Date.now()+p.rem*1000}));
const cnt=pm.done[dk()]||0;
return <div className="px-4 pt-1 pb-3 flex flex-col items-center">
<div className="flex gap-2 mb-4 w-full"><button className={'chip flex-1 '+(pm.mode==='work'?'on':'')} onClick={()=>mode('work')}>Работа</button><button className={'chip flex-1 '+(pm.mode==='break'?'on':'')} onClick={()=>mode('break')}>Перерыв</button></div>

const D={settings,setSettings,lessons,setLessons,extras,setExtras,hw,setHw,shop,setShop,olymp,setOlymp,exams,setExams,pack,setPack,events,setEvents,notes,setNotes};
const T=[['sch','cal','Расписание'],['pl','task','Планер'],['ex','users','Доп.'],['ol','trophy','Олимпиады'],['pm','clock','Таймер']];
const titles={sch:'Расписание',pl:'Планер',ex:'Доп. занятия',ol:'Олимпиады',pm:'Помодоро'};
return <div className="h-full flex flex-col max-w-xl mx-auto">
<header className="flex items-center justify-between px-4 py-3"><h1 className="text-2xl font-extrabold m-0">{titles[tab]}</h1>
<button aria-label="Настройки" className="ghost" onClick={()=>setSt(true)}><I n="cog" s={20}/></button></header>
<main className="flex-1 overflow-y-auto">
{tab==='sch'&&<Schedule D={D}/>}{tab==='pl'&&<Planner D={D}/>}{tab==='ex'&&<Extras D={D}/>}{tab==='ol'&&<Olymp D={D}/>}{tab==='pm'&&<Pomo pm={pm} setPm={setPm} subjects={settings.subjects}/>}</main>
<nav className="grid grid-cols-5" style={{background:'var(--card)',borderTop:'1px solid var(--line)'}}>
{T.map(([k,ic,l])=><button key={k} onClick={()=>setTab(k)} className="flex flex-col items-center gap-0.5 py-2" style={{color:tab===k?'var(--ac)':'var(--mut)',fontWeight:tab===k?800:600,fontSize:12}}><I n={ic} s={22}/>{k==='pm'&&pm.run&&tab!=='pm'?fmt(Math.max(0,Math.ceil((pm.end-Date.now())/1000))):l}</button>)}</nav>
{st&&<Settings D={D} onClose={()=>setSt(false)}/>}
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
